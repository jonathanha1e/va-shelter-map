function makeIcon(color, shape, dimmed) {
  const radius = shape === "square" ? "3px" : "50%";
  const border = dimmed ? "2px dashed rgba(0,0,0,0.55)" : "2px solid white";
  return L.divIcon({
    className: '',
    html: `<div style="background:${color};width:14px;height:14px;border-radius:${radius};border:${border};box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7]
  });
}

// TRANSIT RADIUS LAYERS — 0.25mi and 0.5mi rings around transit stations.

// ============================================================
// ONE-SEAT REACHABILITY ENGINE
// Models each transit line as an ordered, real-world sequence of stops.
// "One-seat" = walking N stops along a SINGLE line's sequence in either
// direction — never crossing to a different line, even at a shared/transfer
// station (that would be a 2-seat trip). This is a simplified model: it
// does not account for turnback/short-turn patterns, skip-stop express
// service, or which exact trains actually run end-to-end. Treat results as
// a reasonable approximation of one-seat-ride reach, not a routing
// guarantee. BART is modeled as its 5 official color lines (with real
// branching); other agencies as their real published lines. LA Metro D
// Line includes the PLANNED Section 2/3 extension (Century City, UCLA,
// Westwood/VA Hospital) so you can see future one-seat reach once built.
// ============================================================
const bartByName = {}; bartStations.forEach(([name,county,qualifies,lat,lng]) => { bartByName[name] = {lat,lng}; });
const caltrainByName = {}; caltrainStations.forEach(([name,lat,lng]) => { caltrainByName[name] = {lat,lng}; });
const laMetroByName = {}; laMetroStations.forEach(([name,line,lat,lng]) => { laMetroByName[name] = {lat,lng}; });
const sdTrolleyByName = {}; sdTrolleyStations.forEach(([name,line,lat,lng]) => { sdTrolleyByName[name] = {lat,lng}; });
const plannedByName = {}; plannedStations.forEach(p => { plannedByName[p.name] = {lat:p.lat,lng:p.lng}; });

function resolveCoord(system, name) {
  const maps = { bart: bartByName, caltrain: caltrainByName, lametro: laMetroByName, sdtrolley: sdTrolleyByName, planned: plannedByName };
  const m = maps[system];
  return (m && m[name]) ? m[name] : null;
}

function seq(system, names) { return names.map(name => ({ system, name })); }

function haversineMiles(lat1,lng1,lat2,lng2) {
  const R = 3958.8;
  const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

const MAX_MEANINGFUL_ACCESS_MILES = 2; // beyond this, "nearest station" is meaningless noise, not a real connection

function findNearestStation(lat, lng) {
  let best = null, bestDist = Infinity;
  lineSequences.forEach(ls => {
    ls.stations.forEach(st => {
      const c = resolveCoord(st.system, st.name);
      if (!c) return;
      const d = haversineMiles(lat, lng, c.lat, c.lng);
      if (d < bestDist) { bestDist = d; best = { system: st.system, name: st.name, lat: c.lat, lng: c.lng, dist: d }; }
    });
  });
  // BUG FIX: previously returned the closest station in the ENTIRE statewide
  // network with no distance cap — so facilities with zero real rail access
  // (Ventura, Santa Barbara, Fresno, most of rural NorCal, etc.) got matched
  // to a "nearest" station dozens of miles away, and then falsely reported
  // as "N stops" from stations near THAT distant station. A facility with no
  // station within a reasonable distance has no meaningful transit
  // connection, full stop — return null rather than a misleading match.
  if (best && best.dist > MAX_MEANINGFUL_ACCESS_MILES) return null;
  return best;
}

function stationsWithinNStops(nearest, n) {
  const seen = new Set();
  const out = [];
  lineSequences.forEach(ls => {
    const idx = ls.stations.findIndex(st => st.system === nearest.system && st.name === nearest.name);
    if (idx === -1) return;
    for (let offset = -n; offset <= n; offset++) {
      if (offset === 0) continue;
      const i = idx + offset;
      if (i < 0 || i >= ls.stations.length) continue;
      const st = ls.stations[i];
      const key = st.system + "|" + st.name;
      if (seen.has(key)) continue;
      seen.add(key);
      const c = resolveCoord(st.system, st.name);
      if (c) out.push({ name: st.name, lat: c.lat, lng: c.lng, line: ls.line, stops: Math.abs(offset), planned: st.system === "planned" });
    }
  });
  return out;
}

// ============================================================
// ACCESSIBILITY LAYERS — network-wide, not per-facility. For EVERY VA
// facility, find its nearest station, then compute which OTHER stations
// are within 3/5/7 stops of that station (one-seat, same line only). Union
// the results across all facilities into three layers: any station
// highlighted in "Within 3 stops" is a one-seat ride from AT LEAST ONE
// veteran facility's nearest station. Marker size scales slightly with how
// many different facilities that station serves — a bigger dot means
// better-connected, not just closer to one thing. Only one of these three
// is shown at a time via the Accessibility toggle.
// ============================================================
const facilityNearestStation = facilities.map(f => ({ facility: f, nearest: findNearestStation(f.lat, f.lng) }));

function buildAccessibilityLayer(n) {
  const layer = L.layerGroup();
  const stationMap = new Map(); // key -> { lat, lng, name, planned, facilities: [{name, stops}] }
  facilityNearestStation.forEach(({ facility, nearest }) => {
    if (!nearest) return;
    const reachable = [
      { name: nearest.name, lat: nearest.lat, lng: nearest.lng, stops: 0, planned: nearest.system === "planned" },
      ...stationsWithinNStops(nearest, n)
    ];
    reachable.forEach(st => {
      const key = st.name + "|" + st.lat.toFixed(4) + "|" + st.lng.toFixed(4);
      if (!stationMap.has(key)) stationMap.set(key, { lat: st.lat, lng: st.lng, name: st.name, planned: st.planned, facilities: [] });
      stationMap.get(key).facilities.push({ name: facility.name, stops: st.stops });
    });
  });
  const coords = [];
  stationMap.forEach(st => {
    coords.push({ lat: st.lat, lng: st.lng });
    const count = st.facilities.length;
    const size = Math.min(10 + count * 2, 26);
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:rgba(184,134,11,0.35);border:2px ${st.planned ? 'dashed' : 'solid'} #b8860b;"></div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2]
    });
    const facilityList = st.facilities
      .sort((a,b) => a.stops - b.stops)
      .map(f => `${f.name} (${f.stops} stop${f.stops === 1 ? '' : 's'})`).join('<br>');
    L.marker([st.lat, st.lng], { icon })
      .bindPopup(`<div class="popup-title">${st.name}${st.planned ? ' (PLANNED)' : ''}</div><div class="popup-row">One-seat ride (within ${n} stops) of ${count} facilit${count === 1 ? 'y' : 'ies'}:</div><div class="popup-row" style="margin-top:4px;">${facilityList}</div>`)
      .addTo(layer);
  });
  return { layer, coords };
}

const accessibility3 = buildAccessibilityLayer(3);
const accessibility5 = buildAccessibilityLayer(5);
const accessibility7 = buildAccessibilityLayer(7);

const accessibility5Layer = accessibility5.layer;

// Current Accessibility toggle state: null (none selected) or 3/5/7.
// Drives which accessibility layer is shown AND which station set the
// transit radius rings use (see rebuildTransitRadiusRings below).
let accessibilityMode = null;

function currentRadiusStationCoords() {
  if (accessibilityMode === 3) return accessibility3.coords;
  if (accessibilityMode === 5) return accessibility5.coords;
  if (accessibilityMode === 7) return accessibility7.coords;
  return allTransitCoords; // no filter selected — ring every combined station
}

function rebuildTransitRadiusRings() {
  transitQuarterMileLayer.clearLayers();
  transitHalfMileLayer.clearLayers();
  currentRadiusStationCoords().forEach(({lat, lng}) => {
    L.circle([lat, lng], { radius: 0.25 * METERS_PER_MILE, color: '#1a73e8', weight: 1, dashArray: '3,3', fillOpacity: 0.02 }).addTo(transitQuarterMileLayer);
    L.circle([lat, lng], { radius: 0.5 * METERS_PER_MILE, color: '#1a73e8', weight: 0.75, fillOpacity: 0.015 }).addTo(transitHalfMileLayer);
  });
}
rebuildTransitRadiusRings();

// Filters the combined transit-stop markers down to just the Accessibility
// selection (if any) — so "All SB 79 transit stops" shows ONLY the stations
// within N stops when a filter is active, not the full 586-stop set. Uses
// the same ~50m tolerance as de-duplication, since two records for the same
// physical stop (e.g. a manual check vs. an agency dataset) can differ by a
// few meters and a strict coordinate-string match would wrongly drop them.
function coordsClose(lat1, lng1, lat2, lng2) {
  return Math.abs(lat1 - lat2) < 0.0005 && Math.abs(lng1 - lng2) < 0.0005;
}
function currentFilteredStationRecords() {
  if (!accessibilityMode) return allStationRecords;
  const targets = currentRadiusStationCoords();
  return allStationRecords.filter(r => targets.some(t => coordsClose(r.lat, r.lng, t.lat, t.lng)));
}

}

    <div class="lp-group">
      <label class="lp-group-header"><input type="checkbox" id="grp-transit" checked> Transit Stops (SB 79-relevant)</label>
      <div class="lp-sub">
        <label><input type="checkbox" id="chk-alltransit"> All SB 79 transit stops (13 agencies + facility-specific checks — click any stop for details)</label>
        <label><input type="checkbox" id="chk-planned"> Planned / under construction</label>
      </div>
    </div>
    <div class="lp-group">
      <label class="lp-group-header">Radius Rings</label>
      <div class="lp-sub">
        <label><input type="checkbox" id="chk-radius-facility-q"> 0.25mi around veteran's facilities</label>
        <label><input type="checkbox" id="chk-radius-facility-h"> 0.5mi around veteran's facilities</label>
        <label><input type="checkbox" id="chk-radius-transit-q"> 0.25mi around transit</label>
        <label><input type="checkbox" id="chk-radius-transit-h"> 0.5mi around transit</label>
      </div>
    </div>
    <div class="lp-group">
      <label class="lp-group-header">Accessibility (one-seat ride from any facility)</label>
      <div class="lp-sub">
        <label><input type="radio" name="access-mode" id="chk-access-none" value="0" checked> None</label>
        <label><input type="radio" name="access-mode" id="chk-access-3" value="3"> Within 3 stops</label>
        <label><input type="radio" name="access-mode" id="chk-access-5" value="5"> Within 5 stops</label>
        <label><input type="radio" name="access-mode" id="chk-access-7" value="7"> Within 7 stops</label>
      </div>
    </div>
  `;
  return div;
};
layerPanel.addTo(map);

// Wire individual layer checkboxes (defaults: VA Medical Centers on, rest off)
wireCheckbox('chk-vamc', categoryLayers["VA Medical Center"], true);
wireCheckbox('chk-cboc', categoryLayers["CBOC"], false);
wireCheckbox('chk-vetcenter', categoryLayers["Vet Center"], false);
wireCheckbox('chk-alltransit', allTransitLayer, false);
wireCheckbox('chk-planned', plannedLayer, false);
wireCheckbox('chk-radius-facility-q', quarterMileLayer, false);
wireCheckbox('chk-radius-facility-h', halfMileLayer, false);
wireCheckbox('chk-radius-transit-q', transitQuarterMileLayer, false);
wireCheckbox('chk-radius-transit-h', transitHalfMileLayer, false);

// Group master checkboxes toggle all children
document.getElementById('grp-facilities').addEventListener('change', (e) => {
  ['chk-vamc','chk-cboc','chk-vetcenter'].forEach(id => {
    const el = document.getElementById(id);
    el.checked = e.target.checked;
    el.dispatchEvent(new Event('change'));
  });
});
document.getElementById('grp-transit').addEventListener('change', (e) => {
  ['chk-alltransit','chk-planned'].forEach(id => {
    const el = document.getElementById(id);
    el.checked = e.target.checked;
    el.dispatchEvent(new Event('change'));
  });
});

// Accessibility toggle (single-select: None / 3 / 5 / 7 stops). Selecting an
// option shows only that layer, re-scopes the transit radius rings (if
// currently on) to just that option's highlighted stations, AND filters the
// "All SB 79 transit stops" layer down to only those same stations — even
// if that layer's own checkbox stays checked the whole time.
const accessLayers = { 3: accessibility3Layer, 5: accessibility5Layer, 7: accessibility7Layer };
document.querySelectorAll('input[name="access-mode"]').forEach(radio => {
  radio.addEventListener('change', () => {
    if (!radio.checked) return;
    Object.values(accessLayers).forEach(l => map.removeLayer(l));
    const val = parseInt(radio.value, 10);
    accessibilityMode = val === 0 ? null : val;
    if (accessibilityMode) accessLayers[accessibilityMode].addTo(map);
    rebuildTransitRadiusRings();
    renderTransitMarkers(currentFilteredStationRecords());
  });
});

// ============================================================
// SEARCH — jump to any facility or transit stop by name. Turns on whichever
// checkbox governs the result (if not already on) so it's actually visible,
// then zooms/pans to it and opens its popup.
// ============================================================
const searchListEl = document.getElementById('search-list');
searchIndex.forEach(entry => {
  const opt = document.createElement('option');
  opt.value = entry.name;
  searchListEl.appendChild(opt);
});

function runSearch() {
  const q = document.getElementById('search-box').value.trim().toLowerCase();
  if (!q) return;
  let match = searchIndex.find(e => e.name.toLowerCase() === q);
  if (!match) match = searchIndex.find(e => e.name.toLowerCase().includes(q));
  if (!match) return;

  const checkbox = document.getElementById(match.checkboxId);
  if (checkbox && !checkbox.checked) {
    checkbox.checked = true;
    checkbox.dispatchEvent(new Event('change'));
  }

  // Transit stops: the actual marker only exists post-render and can be
  // rebuilt by an Accessibility filter change, so look it up fresh via its record.
  const marker = match.record ? transitMarkersByRecord.get(match.record) : match.marker;
  if (!marker) {
    // Filtered out by an active Accessibility selection — clear the filter so the result is visible.
    document.getElementById('chk-access-none').checked = true;
    document.getElementById('chk-access-none').dispatchEvent(new Event('change'));
    const retryMarker = match.record ? transitMarkersByRecord.get(match.record) : match.marker;
    if (!retryMarker) return;
    map.setView([match.lat, match.lng], 15);
    retryMarker.openPopup();
    return;
  }
  if (match.clusterGroup && typeof match.clusterGroup.zoomToShowLayer === 'function') {
    match.clusterGroup.zoomToShowLayer(marker, () => marker.openPopup());
  } else {
    map.setView([match.lat, match.lng], 15);
    marker.openPopup();
  }
}
document.getElementById('search-go').addEventListener('click', runSearch);
document.getElementById('search-box').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

// ============================================================
// RESET VIEW & FILTERS — snap back to the default statewide view and
// default layer state (as if the page had just loaded).
// ============================================================
document.getElementById('reset-view-btn').addEventListener('click', () => {
  map.setView(INITIAL_CENTER, INITIAL_ZOOM);
  document.getElementById('search-box').value = '';
  const defaults = {
    'chk-vamc': true, 'chk-cboc': false, 'chk-vetcenter': false,
    'chk-alltransit': false, 'chk-planned': false,
    'chk-radius-facility-q': false, 'chk-radius-facility-h': false,
    'chk-radius-transit-q': false, 'chk-radius-transit-h': false
  };
  Object.entries(defaults).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el.checked !== val) { el.checked = val; el.dispatchEvent(new Event('change')); }
  });
  const noneRadio = document.getElementById('chk-access-none');
  if (!noneRadio.checked) { noneRadio.checked = true; noneRadio.dispatchEvent(new Event('change')); }
});

  const toggle = div.querySelector('#legend-toggle');

legend.addTo(map);
