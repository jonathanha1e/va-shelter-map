//     meeting CEQA's strict BRT standard (Pub. Res. Code §21060.2(a)(1)):

function makeIcon(color, shape) {
  const radius = shape === "square" ? "3px" : "50%";
  return L.divIcon({
    className: '',
    html: `<div style="background:${color};width:14px;height:14px;border-radius:${radius};border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7]
  });
}

const transitIcon = L.divIcon({
  className: '',
  html: '<div style="background:#1a73e8;width:14px;height:14px;border-radius:3px;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>',
  iconSize: [14, 14], iconAnchor: [7, 7]
});

function bartIcon(qualifies) {
  return L.divIcon({
    className: '',
    html: `<div style="background:${qualifies ? '#003a70' : '#9aa5ad'};width:10px;height:10px;border-radius:50%;border:1.5px solid white;box-shadow:0 0 2px rgba(0,0,0,0.5);"></div>`,
    iconSize: [10, 10], iconAnchor: [5, 5]
  });
}

const caltrainIcon = L.divIcon({
  className: '',
  html: '<div style="background:#d1282e;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid white;box-shadow:0 0 2px rgba(0,0,0,0.5);"></div>',
  iconSize: [9, 9], iconAnchor: [4, 4]
});

const categoryLayers = {};
Object.keys(categoryStyle).forEach(cat => { categoryLayers[cat] = L.layerGroup(); });
const quarterMileLayer = L.layerGroup();
const halfMileLayer = L.layerGroup();
const transitLayer = L.layerGroup();

facilities.forEach(f => {
  const style = categoryStyle[f.category];
  const opacity = f.sb79County ? 1.0 : 0.35; // dim facilities outside SB 79 urban transit counties
  const marker = L.marker([f.lat, f.lng], { icon: makeIcon(style.color, style.shape), opacity: opacity });
  const sb79Line = f.sb79County
    ? `<strong>SB 79 status:</strong> ${f.county} County IS an urban transit county — a nearby SB 79 TOD stop is legally possible here.`
    : `<strong>SB 79 status:</strong> ${f.county} County is NOT an urban transit county — no SB 79 TOD stop can exist near this facility, regardless of local transit.`;
  marker.bindPopup(`
    <div class="popup-title">${f.name}</div>
    <div class="popup-tag">${f.category}</div>
    <div class="popup-row"><strong>Address:</strong> ${f.address}</div>
    <div class="popup-row"><strong>Website:</strong> <a class="popup-link" href="${f.url}" target="_blank" rel="noopener">${f.url}</a></div>
    <div class="popup-row" style="margin-top:6px; color:${f.sb79County ? '#1a7a2e' : '#a33'};">${sb79Line}</div>
    <div class="popup-row" style="margin-top:4px; color:#444;">${f.note}</div>
  `);
  marker.addTo(categoryLayers[f.category]);

  L.circle([f.lat, f.lng], { radius: 0.25 * METERS_PER_MILE, color: style.color, weight: 1.5, dashArray: '4,4', fillOpacity: 0.03, opacity: opacity }).addTo(quarterMileLayer);
  L.circle([f.lat, f.lng], { radius: 0.5 * METERS_PER_MILE, color: style.color, weight: 1, fillOpacity: 0.02, opacity: opacity }).addTo(halfMileLayer);
});

transitStops.forEach(t => {

});

  marker.bindPopup(`
    <div class="popup-title">${name} (BART)</div>
    <div class="popup-row" style="color:${qualifies ? '#003a70' : '#a33'};">${tierLine}</div>

});

const caltrainLayer = L.layerGroup();

  marker.addTo(caltrainLayer);
});
