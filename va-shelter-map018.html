<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>California VA Facilities &amp; SB 79 Transit Stops</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    font-size: 13px; line-height: 1.45;
  }
  .controls { padding: 10px 12px; max-width: 240px; }
  .controls h1 { font-size: 13px; margin: 0 0 6px; font-weight: 700; }
  .controls label { display: flex; align-items: center; gap: 7px; margin: 3px 0; cursor: pointer; }
  .controls .grp { margin: 6px 0; padding-top: 5px; border-top: 1px solid #ececec; }
  .controls .grp-h { font-size: 11px; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .04em; color: #888; margin-bottom: 3px; }
  .controls .sub { color: #666; font-size: 11.5px; margin: 6px 0 0; }
  .controls { max-height: 82vh; overflow-y: auto; }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.35); }
  .sq  { width: 13px; height: 13px; flex-shrink: 0; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }

  .legend { padding: 9px 12px; max-width: 230px; max-height: 46vh; overflow-y: auto; }
  .legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .legend .note { color: #666; font-size: 11px; margin-top: 7px; border-top: 1px solid #e3e3e3; padding-top: 6px; }

  .leaflet-popup-content { font-size: 12.5px; line-height: 1.5; margin: 10px 12px; }
  .pt { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
  .tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .03em;
         background: #eee; color: #333; padding: 1px 6px; border-radius: 3px; margin-bottom: 5px; }
  .muted { color: #555; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
             background: #fff; padding: 14px 20px; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading">Loading map data…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Data (generated — see data/sb79/SOURCES.md and data/va/build_facilities.py) -->
<script src="data/sb79/sb79-tod-stops.js"></script>
<script src="data/va/va-ca-facilities.js"></script>
<script src="data/care/care-facilities.js"></script>
<script>
// ============================================================
// California VA facilities + SB 79 transit-oriented-development stops.
// Plain visual: every qualifying transit stop is a dot; VA medical centers
// and CBOCs are squares; an optional half-mile ring sits around each facility
// (SB 79's TOD zone is the area within 1/2 mile of a stop). No routing, no
// line geometry, no accessibility model — just where things are.
//
//   Transit stops   window.SB79_TOD_STOPS  (data/sb79/, from the 4 MPO maps)
//   VA facilities    window.VA_FACILITIES   (data/va/, from the VHA layer)
// ============================================================

const COLORS = {
  tier1: '#1a4fa0',   // heavy rail / very-high-freq commuter rail
  tier2: '#e08b2e',   // light rail / high-freq commuter rail / qualifying bus
  mc:    '#c62828',   // VA medical center
  cboc:  '#7b1fa2',   // community-based outpatient clinic
  ring:  '#444',
};
// care-facility categories -> [color, layerKey, label]
const CARE = {
  fqhc:              ['#2e7d32', 'Health centers (FQHC)'],
  bh_substance_use:  ['#a1887f', 'Substance-use treatment'],
  bh_mental_health:  ['#26a69a', 'Mental-health treatment'],
  regional_center:   ['#f9a825', 'DDS Regional Centers'],
  independent_living:['#ec407a', 'Independent Living Centers'],
};
const MILE_M = 1609.34;

const map = L.map('map', { preferCanvas: true, zoomControl: true })
  .setView([36.3, -119.4], 6);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);

const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])));

// ---- layers ------------------------------------------------------------
const layers = {
  tier1:       L.layerGroup(),
  tier2:       L.layerGroup(),
  mc:          L.layerGroup(),
  cboc:        L.layerGroup(),
  stopQuarter: L.layerGroup(),
  stopHalf:    L.layerGroup(),
  vaQuarter:   L.layerGroup(),
  vaHalf:      L.layerGroup(),
  fqhc:              L.layerGroup(),
  bh_substance_use:  L.layerGroup(),
  bh_mental_health:  L.layerGroup(),
  regional_center:   L.layerGroup(),
  independent_living:L.layerGroup(),
};

// Ring layers are populated on first use (thousands of circles otherwise
// build on page load). ringSpec: [layerKey, () => [[lat,lng],...], miles, color]
const ringCoords = { stop: [], va: [] };
const RING_STYLE = {
  stopQuarter: { src: 'stop', mi: 0.25, color: '#2f6f4f' },
  stopHalf:    { src: 'stop', mi: 0.5,  color: '#2f6f4f' },
  vaQuarter:   { src: 'va',   mi: 0.25, color: '#c62828' },
  vaHalf:      { src: 'va',   mi: 0.5,  color: '#c62828' },
};
const ringsBuilt = {};
function ensureRings(key) {
  const spec = RING_STYLE[key];
  if (!spec || ringsBuilt[key]) return;
  ringsBuilt[key] = true;
  ringCoords[spec.src].forEach(([lat, lng]) => {
    L.circle([lat, lng], {
      radius: spec.mi * MILE_M, color: spec.color, weight: 0.8, opacity: 0.5,
      fillColor: spec.color, fillOpacity: spec.mi < 0.4 ? 0.06 : 0.03,
    }).addTo(layers[key]);
  });
}

// ---- SB 79 transit stops --------------------------------------------------
const MODE_LABEL = {
  heavy_rail: 'Heavy rail', light_rail: 'Light rail', commuter_rail: 'Commuter rail',
  brt: 'Bus rapid transit', bus: 'Qualifying bus service', unknown: 'Rail transit',
};
// Collapse the several pedestrian-access-point rows per physical station into
// one dot (the user wants station dots, not platform dots). Group by
// station_key; a station's tier is the most permissive (lowest) of its rows.
const stations = new Map();
(window.SB79_TOD_STOPS?.features || []).forEach(f => {
  const p = f.properties, c = f.geometry.coordinates;
  const key = p.station_key || (p.name + '|' + p.mpo);
  let s = stations.get(key);
  if (!s) {
    s = { lat: 0, lng: 0, n: 0, tiers: new Set(), modes: new Set(), lines: new Set(),
          name: p.name, agency: p.agency, city: p.city, county: p.county,
          mpo: p.mpo, planned: true };
    stations.set(key, s);
  }
  s.lat += c[1]; s.lng += c[0]; s.n++;
  if (p.tier) s.tiers.add(p.tier);
  if (p.mode && p.mode !== 'unknown') s.modes.add(p.mode);
  if (p.line) p.line.split(/[,;]/).forEach(x => x.trim() && s.lines.add(x.trim()));
  if (p.status !== 'planned') s.planned = false;
  if (!s.name && p.name) s.name = p.name;
});

let nT1 = 0, nT2 = 0, nPlanned = 0;
stations.forEach(s => {
  const lat = s.lat / s.n, lng = s.lng / s.n;
  const tier = s.tiers.has(1) ? 1 : (s.tiers.has(2) ? 2 : null);
  const color = tier === 1 ? COLORS.tier1 : COLORS.tier2;
  if (s.planned) nPlanned++;
  if (tier === 1) nT1++; else nT2++;
  const modes = [...s.modes].map(m => MODE_LABEL[m] || m).join(', ') || 'Rail transit';
  const lines = [...s.lines].slice(0, 8).join(', ');
  ringCoords.stop.push([lat, lng]);

  L.circleMarker([lat, lng], {
    radius: 3,
    color: s.planned ? color : 'rgba(0,0,0,.3)',
    weight: s.planned ? 1.3 : 0.5,
    fillColor: color,
    fillOpacity: s.planned ? 0.10 : 0.85,
    dashArray: s.planned ? '2,2' : null,
  }).bindPopup(
    `<div class="pt">${esc(s.name) || 'Transit stop'}</div>` +
    `<div class="tag">SB 79 ${tier ? 'Tier ' + tier : 'stop'}${s.planned ? ' · planned' : ''}</div>` +
    `<div class="muted">${esc(modes)}${s.agency ? ' — ' + esc(s.agency) : ''}` +
      `${lines ? ' (' + esc(lines) + ')' : ''}<br>` +
      `${esc(s.city && s.city !== s.county ? s.city + ', ' : '')}${esc(s.county)} County · ${esc(s.mpo)}</div>`
  ).addTo(tier === 1 ? layers.tier1 : layers.tier2);
});

// ---- VA facilities -------------------------------------------------------
let nMC = 0, nCBOC = 0;
(window.VA_FACILITIES?.features || []).forEach(f => {
  const p = f.properties, c = f.geometry.coordinates;
  const isMC = p.type === 'Medical Center';
  if (isMC) nMC++; else nCBOC++;
  const color = isMC ? COLORS.mc : COLORS.cboc;
  const size = isMC ? 15 : 11;

  L.marker([c[1], c[0]], {
    icon: L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;background:${color};` +
            `border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);` +
            `${isMC ? 'border-radius:2px;' : 'border-radius:50%;'}"></div>`,
      iconSize: [size, size], iconAnchor: [size / 2, size / 2],
    }),
  }).bindPopup(
    `<div class="pt">${esc(p.name)}</div>` +
    `<div class="tag">${esc(p.type)}</div>` +
    `<div class="muted">${esc(p.address)}<br>${esc(p.county)} County` +
    `${p.override_reason ? '<br><br><em>Location note: ' + esc(p.override_reason) + '</em>' : ''}</div>`
  ).addTo(isMC ? layers.mc : layers.cboc);

  ringCoords.va.push([c[1], c[0]]);
});

// ---- care facilities (health & disability) -----------------------------
const nCare = {};
(window.CARE_FACILITIES?.features || []).forEach(f => {
  const p = f.properties, c = f.geometry.coordinates;
  const spec = CARE[p.category];
  if (!spec) return;
  nCare[p.category] = (nCare[p.category] || 0) + 1;
  L.circleMarker([c[1], c[0]], {
    radius: 3, color: 'rgba(0,0,0,.3)', weight: 0.5,
    fillColor: spec[0], fillOpacity: 0.85,
  }).bindPopup(
    `<div class="pt">${esc(p.name)}</div>` +
    `<div class="tag">${esc(p.category_label)}</div>` +
    `<div class="muted">${esc(p.address)}${p.county ? '<br>' + esc(p.county) + ' County' : ''}` +
    `${p.services ? '<br>' + esc(p.services) : ''}` +
    `${p.phone ? '<br>' + esc(p.phone) : ''}</div>`
  ).addTo(layers[p.category]);
});

// ---- default visible ---------------------------------------------------
['tier1', 'tier2', 'mc', 'cboc', 'vaHalf'].forEach(k => {
  ensureRings(k);            // no-op for non-ring keys
  layers[k].addTo(map);
});

// ---- controls --------------------------------------------------------
const nf = n => n.toLocaleString('en-US');

// [key, label, swatchHTML, defaultOn]
const CONTROL_GROUPS = [
  ['SB 79 transit', [
    ['tier1', 'Tier 1 stations', `<span class="dot" style="background:${COLORS.tier1}"></span>`, true],
    ['tier2', 'Tier 2 stations', `<span class="dot" style="background:${COLORS.tier2}"></span>`, true],
    ['stopQuarter', '&frac14;-mile around stops', `<span class="dot" style="background:#2f6f4f;opacity:.5"></span>`, false],
    ['stopHalf', '&frac12;-mile around stops', `<span class="dot" style="background:#2f6f4f;opacity:.3"></span>`, false],
  ]],
  ['VA facilities', [
    ['mc', 'Medical centers', `<span class="sq" style="background:${COLORS.mc}"></span>`, true],
    ['cboc', 'CBOCs (VA clinics)', `<span class="dot" style="background:${COLORS.cboc}"></span>`, true],
    ['vaQuarter', '&frac14;-mile around VA sites', `<span class="dot" style="background:#c62828;opacity:.5"></span>`, false],
    ['vaHalf', '&frac12;-mile around VA sites', `<span class="dot" style="background:#c62828;opacity:.3"></span>`, true],
  ]],
  ['Health & disability services', Object.entries(CARE).map(([k, [color, label]]) =>
    [k, label, `<span class="dot" style="background:${color}"></span>`, false])],
];

const control = L.control({ position: 'topright' });
control.onAdd = () => {
  const d = L.DomUtil.create('div', 'panel controls');
  d.innerHTML = '<h1>Show on map</h1>' + CONTROL_GROUPS.map(([title, items]) =>
    `<div class="grp"><div class="grp-h">${title}</div>` + items.map(([k, label, sw, on]) =>
      `<label><input type="checkbox" data-k="${k}" ${on ? 'checked' : ''}>${sw} ${label}</label>`
    ).join('') + '</div>'
  ).join('') + '<div class="sub">Hollow dashed dots = planned stops.</div>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  d.querySelectorAll('input').forEach(inp => inp.addEventListener('change', e => {
    const k = e.target.dataset.k;
    if (e.target.checked) { ensureRings(k); layers[k].addTo(map); }
    else map.removeLayer(layers[k]);
  }));
  return d;
};
control.addTo(map);

// ---- legend --------------------------------------------------------
const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'panel legend');
  d.innerHTML = `
    <div class="row"><span class="dot" style="background:${COLORS.tier1}"></span> Tier 1 station &nbsp;<b>${nf(nT1)}</b></div>
    <div class="row"><span class="dot" style="background:${COLORS.tier2}"></span> Tier 2 station &nbsp;<b>${nf(nT2)}</b></div>
    <div class="row"><span class="sq" style="background:${COLORS.mc}"></span> VA medical center &nbsp;<b>${nf(nMC)}</b></div>
    <div class="row"><span class="dot" style="background:${COLORS.cboc}"></span> CBOC &nbsp;<b>${nf(nCBOC)}</b></div>
    ${Object.entries(CARE).map(([k, [color, label]]) => nCare[k]
      ? `<div class="row"><span class="dot" style="background:${color}"></span> ${label} &nbsp;<b>${nf(nCare[k])}</b></div>` : '').join('')}
    <div class="note">SB 79 (Gov. Code &sect;&sect;&nbsp;65912.155&ndash;.162) qualifying transit
      stops in California's urban transit counties, from the SCAG / MTC / SANDAG / SACOG maps.
      VA sites from the VHA facilities layer; health &amp; disability facilities from
      HRSA, SAMHSA, CA&nbsp;DDS and Cal&nbsp;OES. &frac12;&#8209;mile ring = SB&nbsp;79 TOD zone;
      &frac14;&#8209;mile ring = inner band. Data &amp; sources: <code>data/</code> in the repo.
      ${nPlanned ? nf(nPlanned) + ' planned stops shown hollow.' : ''}</div>`;
  return d;
};
legend.addTo(map);

// ---- done ----------------------------------------------------------
const el = document.getElementById('loading');
if (!window.SB79_TOD_STOPS || !window.VA_FACILITIES || !window.CARE_FACILITIES) {
  el.textContent = 'Could not load data files (data/…). Serve this page over http, not file://.';
} else {
  el.remove();
}
</script>
</body>
</html>
